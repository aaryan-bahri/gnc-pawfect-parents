<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawfect Parents: Player Decision Tree</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&display=swap">
<style>
:root {
  --paper:#FFF4E0; --card:#FFFDF7; --ink:#5A3E36; --dim:#8a6f66; --line:#C9A27F; --soft:#F3E4CB;
  --lav:#D7C4EC; --lav-d:#B39DD6; --butter:#FFE08A; --butter-d:#E0B53F; --mint:#B8E0C2; --mint-d:#6FA07E;
  --coral:#F9D5D1; --coral-d:#E8746A; --sky:#BFE3F2; --sky-d:#6FAFCB;
  --lo1:#E8746A; --lo2:#F2C55C; --lo3:#8DBF9A; --lo4:#8FC3DB; --lo5:#B39DD6; --ctx:#B9855A;
  --display:"Pixelify Sans",ui-monospace,Consolas,monospace; --body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.45 var(--body); }
.wrap { padding:0 max(20px, env(safe-area-inset-left, 0px)) 60px; max-width:none; }
h1,h2 { font-family:var(--display); font-weight:600; margin:0; text-wrap:balance; }
h1 { font-size:34px; line-height:1.1; }
h2 { font-size:24px; }
a { color:inherit; }

/* ---------- header + controls */
.top { padding:28px 0 8px; }
.top p { max-width:80ch; margin:8px 0 0; color:var(--dim); }
.bar { position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:2px solid var(--ink); padding:10px 0; margin:14px 0 0; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
.bar b { font-family:var(--display); font-weight:600; }
.group { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
button, input { font:inherit; color:inherit; }
.btn { background:var(--card); border:2px solid var(--ink); padding:4px 10px; cursor:pointer; box-shadow:2px 2px 0 var(--ink); }
.btn:hover { background:var(--butter); }
.btn:focus-visible, .box:focus-visible, .chip:focus-visible, .nav a:focus-visible { outline:3px solid var(--coral-d); outline-offset:2px; }
input[type=search] { background:var(--card); border:2px solid var(--ink); padding:4px 8px; width:210px; }
.chip { border:2px solid var(--ink); background:var(--card); padding:2px 9px; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
.chip i, .lo { font-style:normal; font-weight:700; font-size:11px; letter-spacing:.04em; padding:1px 6px; border:1.5px solid var(--ink); }
.chip[aria-pressed=true] { background:var(--butter); box-shadow:2px 2px 0 var(--ink); }
.lo1 { background:var(--lo1); } .lo2 { background:var(--lo2); } .lo3 { background:var(--lo3); } .lo4 { background:var(--lo4); } .lo5 { background:var(--lo5); } .ctx { background:#E8CFB5; }
.nav { display:flex; flex-wrap:wrap; gap:4px 14px; padding:8px 0 0; font-size:13px; }
.status { color:var(--dim); font-size:13px; margin-left:auto; }
.legend { display:flex; flex-wrap:wrap; gap:6px 16px; padding:12px 0 0; font-size:12.5px; color:var(--dim); }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.sw { width:16px; height:12px; border:2px solid var(--ink); display:inline-block; }

/* ---------- sections */
.page { padding:28px 0 8px; }
.sec-hd { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; margin-bottom:6px; }
.sec-hd .los { display:flex; gap:6px; }
.desc { max-width:100ch; color:var(--dim); margin:0 0 14px; }
.scroll { overflow-x:auto; padding:6px 4px 18px; }
.flow { display:flex; flex-wrap:wrap; align-items:stretch; gap:10px 0; }
.step { width:250px; background:var(--lav); border:2px solid var(--lav-d); padding:8px 10px; position:relative; margin-right:34px; text-decoration:none; }
.step:hover { background:#E6D8F4; }
.step .num { position:absolute; left:-2px; top:-2px; background:var(--ink); color:var(--paper); font:700 12px/1 var(--display); padding:4px 7px; }
.step b { padding-left:24px; }
.step b { display:block; }
.step small { color:var(--dim); display:block; margin:2px 0 4px; }

/* ---------- the tree: left to right, each node's children stacked to its right */
.node { display:flex; align-items:center; }
.kids { display:flex; flex-direction:column; position:relative; }
.kids::before { content:""; position:absolute; left:0; top:50%; width:24px; border-top:2px solid var(--line); }
.kid { position:relative; padding:6px 0 6px 48px; }
.kid::before { content:""; position:absolute; left:24px; top:50%; width:24px; border-top:2px solid var(--line); }
.kid::after { content:""; position:absolute; left:24px; top:0; bottom:0; border-left:2px solid var(--line); }
.kid:first-child::after { top:50%; } .kid:last-child::after { bottom:50%; } .kid:only-child::after { display:none; }
.node.closed > .kids { display:none; }

.box { position:relative; border:2px solid var(--ink); background:var(--card); padding:8px 11px 9px; width:260px; box-shadow:3px 3px 0 rgba(90,62,54,.25); }
.box.has-kids { cursor:pointer; }
.box.has-kids::after { content:"–"; position:absolute; right:-11px; top:50%; margin-top:-10px; width:20px; height:20px; border:2px solid var(--ink); background:var(--card); border-radius:50%; font:700 14px/16px var(--body); text-align:center; z-index:2; }
.node.closed > .box.has-kids::after { content:"+"; background:var(--butter); }
.t-scene { width:330px; background:var(--lav); border-color:var(--lav-d); }
.t-decision { width:310px; background:var(--butter); border-color:var(--butter-d); }
.t-action { width:236px; background:var(--card); }
.t-outcome { width:390px; }
.t-outcome.good { background:#E4F4E8; border-color:var(--mint-d); }
.t-outcome.bad { background:#FCE6E3; border-color:var(--coral-d); }
.t-outcome.info { background:#E6F4FA; border-color:var(--sky-d); }
.t-outcome.neutral { background:#F6EEE0; border-color:var(--line); }
.t-system { width:330px; background:#EEE6D8; border-color:var(--dim); border-style:dashed; }
.hd { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.kind { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
.ttl { font-weight:700; font-size:14px; }
.meter { margin-left:auto; font-weight:700; font-size:12px; padding:0 7px; border:2px solid var(--ink); background:var(--card); font-variant-numeric:tabular-nums; }
.meter.up { background:var(--mint); } .meter.down { background:var(--coral); }
.sub { margin:3px 0 0; font-size:12.5px; color:var(--dim); }
.dog { margin:5px 0 0; font-size:12.5px; font-style:italic; }
.say { margin:6px 0 0; font-size:13px; padding-left:8px; border-left:4px solid var(--line); }
.say b { font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; display:block; color:var(--dim); }
.say.parent { border-color:var(--coral-d); } .say.vet { border-color:var(--sky-d); } .say.hint { border-color:var(--butter-d); } .say.sys { border-color:var(--dim); }
.card { margin:7px 0 0; padding:5px 8px; font-size:12.5px; border:2px solid var(--ink); background:var(--card); }
.card b { display:block; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; }
.card.good { border-color:var(--mint-d); } .card.good b { color:#3F7B52; }
.card.bad { border-color:var(--coral-d); } .card.bad b { color:#B6453D; }
.card.info { border-color:var(--sky-d); } .card.info b { color:#2F7A9B; }
.note { margin:6px 0 0; font-size:12px; color:var(--dim); }
.los { display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; }

/* filtering */
.box.dim { opacity:.22; }
.box.via { opacity:.62; }
.box.found { outline:3px solid var(--coral-d); outline-offset:1px; }

/* ---------- static render (PNG / PDF) */
body.static { width:max-content; min-width:100%; }
body.static .bar, body.static .nav, body.static .btn { display:none; }
body.static .scroll { overflow:visible; }
body.static .box { box-shadow:none; }
body.static .page { padding-left:40px; padding-right:40px; }
body.static.print .page { break-after:page; break-inside:avoid; }
body.static.print .page:last-child, body.static.print .page .page { break-after:auto; }   /* the overview sits inside the title page */
.foot { color:var(--dim); font-size:12.5px; padding:24px 0 0; max-width:110ch; }
@media (max-width:700px) { .bar { position:static; } input[type=search] { width:100%; } }
@media (prefers-reduced-motion:no-preference) { .box { transition:opacity .15s; } }
</style>
</head>

er cooked or raw."}],"lines":[{"who":"Parent","text":"Good thing Biscuit didn't eat it. I'll put that up high where they can't reach.","cls":"parent"},{"who":"Parent","text":"Look again at both foods. Which one is safe for Biscuit?","cls":"parent"}],"note":"The parent puts it up in the high cupboard (safe storage). The same pair comes back with the sides swapped. A card is never shown twice."}]}]}]}]},{"t":"action","title":"Do nothing for 15 seconds","kids":[{"t":"outcome","tone":"info","title":"Idle hint","lines":[{"who":"Parent (idle hint)","text":"Dogs need dog food or plain, simple foods. Sweets and some fruits are dangerous.","cls":"hint"}],"lo":["LO1"]}]}]}]},{"id":"potty","title":"Level 1, Task 2: Potty Training","nav":"L1 Potty Training","lo":["LO2","LO3"],"desc":"It starts with an accident: the puppy pees on the rug before the player can act. Then place the pad, read the signs, lead the puppy with a treat and reward it right away.","roots":[{"t":"scene","title":"“Later that afternoon” cutscene","lines":[{"who":"Time card","text":"Later that afternoon","cls":"hint"},{"who":"Parent","text":"Biscuit has had lunch and lots of play. Puppies often need to go potty after that...","cls":"parent"},{"who":"Story","text":"Wait... why is Biscuit sniffing the rug like that?","cls":"parent"}],"lo":["CTX","LO2"]},{"t":"decision","title":"The accident (no input: the puppy sniffs, circles and pees on the rug)","lines":[{"who":"Parent","text":"Oh no, Biscuit had an accident on the rug! What do you do?","cls":"parent"}],"lo":["LO3"],"kids":[{"t":"action","title":"Scold the puppy","kids":[{"t":"outcome","tone":"bad","title":"Scolded","dog":"The puppy cowers.","meter":"−5","lo":["LO3"],"cards":[{"kind":"bad","title":"Did you know?","text":"Scolding teaches puppies to hide when they go, not where to go."}]}]},{"t":"action","title":"Clean it up calmly","kids":[{"t":"outcome","tone":"good","title":"Calm clean-up","dog":"The puddle fades away.","meter":"+10","lo":["LO3"],"cards":[{ he signs and lead the puppy (two successes needed)","sub":"The puppy wanders for a few seconds, then sniffs the floor and circles. A thought bubble shows a droplet. The treat sits on the counter.","lines":[{"who":"Parent","text":"Now watch Biscuit closely. Sniffing and circling mean they need to go!","cls":"parent"}],"lo":["LO2","LO3"],"kids":[{"t":"decision","title":"The puppy sniffs and circles (12 seconds, counted from OK)","sub":"The explanation appears the moment the signs start; the clock starts when it is closed. The first time, a ghost-hand demo shows the move; the ? button replays it. A yellow arrow points at the treat.","lines":[{"who":"Parent","text":"Biscuit is sniffing and circling. That means \"I need to go!\" Drag the treat from the counter to lead them to the pad.","cls":"parent"},{"who":"Parent, second time","text":"Biscuit is sniffing again! Lead them to the pad.","cls":"parent"}],"lo":["LO2"],"kids":[{"t":"action","title":"Drag the treat and keep holding it so the puppy follows it onto the pad","kids":[{"t":"outcome","tone":"neutral","title":"The puppy goes potty on the pad","dog":"It follows the treat, reaches the pad, pees for a moment, then wags with a treat thought bubble.","lines":[{"who":"Parent","text":"Biscuit went on the pad! Reward them right away: drop the treat on Biscuit.","cls":"parent"}],"lo":["LO2"],"kids":[{"t":"decision","title":"Reward right away","sub":"A demo shows dropping the treat on the puppy (first time). The puppy lights up while the treat is over it.","lo":["LO3"],"kids":[{"t":"action","title":"Drop the treat on the puppy","kids":[{"t":"outcome","tone":"good","title":"Reward given","dog":"The puppy eats, wags, and a heart floats up.","meter":"+20","lo":["LO3"],"cards":[{"kind":"good","title":"Great job!","text":"That's positive reinforcement! Rewarding good behavior right away is a great way to train a dog. Biscuit learns that using the pad means good things happen."}],"note":"The card is shown the first time only. The second time the parent says: “Biscuit did it again, and you rewarded them right away. That's how puppies learn!”"}]},{"t":"action","title":"Wait 15 seconds","kids":[{"t":"outcome","tone":"info","title":"Idle hint","lines":[{"who":"Parent (idle hint)","text":"Biscuit went on the pad! Reward them right away: drop the treat on Biscuit.","cls":"hint"}],"lo":["LO3"]}]}]}]}]},{"t":"action","title":"Let go of the treat too early","kids":[{"t":"outcome","tone":"neutral","title":"The treat jumps back to the counter","dog":"The puppy keeps circling and waits.","note":"No message. The timer keeps running.","lo":["LO2"]}]},{"t":"action","title":"Run out of time, or never reach the pad","kids":[{"t":"outcome","tone":"bad","title":"Another accident","dog":"The puppy pees where it stands.","lines":[{"who":"Parent","text":"Oh no, Biscuit had an accident on the rug! What do you do?","cls":"parent"}],"lo":["LO3"],"kids":[{"t":"action","title":"Scold the puppy","kids":[{"t":"outcome","tone":"bad","title":"Scolded","dog":"The puppy cowers.","meter":"−5","lo":["LO3"],"cards":[{"kind":"bad","title":"Did you know?","text":"Scolding teaches puppies to hide when they go, not where to go."}]}]},{"t":"action","title":"Clean it up calmly","kids":[{"t":"outcome","tone":"good","title":"Calm clean-up","dog":"The puddle fades away.","meter":"+10","lo":["LO3"],"cards":[{"kind":"good","title":"Did you know?","text":"Clean accidents well. Leftover smell makes a puppy go there again."}]}]}]}]}]}]},{"t":"outcome","tone":"good","title":"Task complete (two successes)","lines":[{"who":"Parent","text":"Biscuit is learning fast!","cls":"parent"}],"cards":[{"kind":"info","title":"Did you know?","text":"Puppies often need to go after waking up, eating, and playing."}],"lo":["LO2"],"note":"The “That night” cutscene, then the Day 1 album page."}]},{"id":"spot","title":"Level 2, Task 1: Spot the Difference","nav":"L2 Spot the Difference","lo":["LO4"],"desc":"Two framed pictures: a healthy dog with the right products, and your dog with the grooming bag from home. Hovering a part lights it up in both. Tapping opens both close-ups side by side. Eight differences, three decoys.","roots":[{"t":"scene","title":"Level 2 intro cutscene","lines":[{"who":"Time card","text":"One morning","cls":"hint"},{"who":"Parent","text":"Biscuit keeps scratching. Let's take them to the vet for a check-up.","cls":"parent"},{"who":"Parent","text":"Bring Biscuit's grooming bag too. The vet can check what we use at home.","cls":"parent"},{"who":"Parent","text":"Here we are! Biscuit is a little nervous. Stay close and keep calm.","cls":"parent"},{"who":"Vet","text":"Hello, Biscuit! Let's compare you with a healthy dog, and check that grooming bag too.","cls":"vet"}],"lo":["CTX","LO4"]},{"t":"decision","title":"Start of the task","sub":"The first time, a ghost-hand demo shows the move; the ? button replays it. Meter drain: 0.35 per second.","lines":[{"who":"Vet","text":"On the left is a healthy dog. On the right is Biscuit, with the grooming bag from home. Tap anything to look closer. Can you find 8 differences?","cls":"vet"}],"lo":["LO4"],"kids":[{"t":"action","title":"Tap the paws, then the difference in the close-up","kids":[{"t":"outcome","tone":"good","title":"Found: nails","meter":"+15","lo":["LO4"],"cards":[{"kind":"good","title":"Found it!","text":"Biscuit's nails are too long. Long nails hurt when a dog walks, so trim the tips regularly."}],"note":"Circled in both close-ups and in the big picture. The counter in the task card goes up."}]},{"t":"action","title":"Tap the ears, then the difference in the close-up","kids":[{"t":"outcome","tone":"good","title":"Found: ears","meter":"+15","lo":["LO4"],"cards":[{"kind":"good","title":"Found it!","text":"Brown wax in the ears! A gentle dog ear cleaner helps, and a weekly check keeps ears healthy."}],"note":"Circled in both close-ups and in the big picture. The counter in the task card goes up."}]},{"t":"action","title":"Tap the teeth, then the difference in the close-up","kids":[{"t":"outcome","tone":"good","title":"Found: teeth","meter":"+15","lo":["LO4"],"cards":[{"kind":"good","title":"Found it!","text":"Yellow tartar on the teeth. Brushing a few times a week with dog toothpaste keeps teeth and gums healthy."}],"note":"Circled in both close-ups and in the big picture. The counter in the task card goes up."}]},{"t":"action","title":"Tap the coat, then the difference in the close-up","kids":[{"t":"outcome","tone":"good","title":"Found: fleas","meter":"+15","lo":["LO4"],"cards":[{"kind":"good","title":"Found it!","text":"Fleas! They make dogs itch and can spread illness. Monthly flea prevention keeps them away."}],"note":"Circled in both close-ups and in the big picture. The counter in the task card goes up."}]},{"t":"action","title":"Tap the toothpaste, then the difference in the close-up","kids":[{"t":"outcome","tone":"good","title":"Found: toothpaste","meter":"+15","lo":["LO4"],"cards":[{"kind":"good","title":"Found it!","text":"That toothpaste is for people. It often has xylitol or fluoride, which are unsafe for dogs to swallow."}],"note":"Circled in both close-ups and in the big picture. The counter in the task card goes up."}]},{"t":"action","title":"Tap the shampoo, then the difference in the close-up","kids":[{"t":"outcome","tone":"good","title":"Found: shampoo","meter":"+15","lo":["LO4"],"cards":[{"kind":"good","title":"Found it!","text":"That shampoo is for people. A dog's skin is different from ours, so use a shampoo made for dogs."}],"note":"Circled in both close-ups and in the big picture. The counter in the task card goes up."}]},{"t":"action","title":"Tap the flea drops, then the difference in the close-up","kids":[{"t":"outcome","tone":"good","title":"Found: flea","meter":"+15","lo":["LO4"],"cards":[{"kind":"good","title":"Found it!","text":"Those flea drops are for cats! Flea products are made for one kind of animal, so always match the label."}],"note":"Circled in both close-ups and in the big picture. The counter in the task card goes up."}]},{"t":"action","title":"Tap the toy, then the difference in the close-up","kids":[{"t":"outcome","tone":"good","title":"Found: toy","meter":"+15","lo":["LO4"],"cards":[{"kind":"good","title":"Found it!","text":"That ball is small enough to swallow, and it could make a dog choke. Choose a toy bigger than its mouth."}],"note":"Circled in both close-ups and in the big picture. The counter in the task card goes up."}]},{"t":"action","title":"Tap the eyes (a decoy)","kids":[{"t":"outcome","tone":"neutral","title":"They are the same","lines":[{"who":"Vet","text":"Biscuit's eyes look just like the healthy dog's: bright and clear!","cls":"vet"}],"lo":["LO4"],"note":"No change to the meter. Back closes the close-up."}]},{"t":"action","title":"Tap the tail (a decoy)","kids":[{"t":"outcome","tone":"neutral","title":"They are the same","lines":[{"who":"Vet","text":"Both tails look the same. Fluffy and happy!","cls":"vet"}],"lo":["LO4"],"note":"No change to the meter. Back closes the close-up."}]},{"t":"action","title":"Tap the brush (a decoy)","kids":[{"t":"outcome","tone":"neutral","title":"They are the same","lines":[{"who":"Vet","text":"Both brushes are the same. That brush is just right!","cls":"vet"}],"lo":["LO4"],"note":"No change to the meter. Back closes the close-up."}]},{"t":"action","title":"Tap the wrong place in a close-up","kids":[{"t":"outcome","tone":"bad","title":"A miss","meter":"−5 (once per close-up)","lines":[{"who":"Vet","text":"Look again: compare both pictures.","cls":"vet"},{"who":"Vet","text":"Hmm, not there.","cls":"vet"}],"lo":["LO4"]}]},{"t":"action","title":"Do nothing for 25 seconds","kids":[{"t":"outcome","tone":"info","title":"Idle hint","lines":[{"who":"Vet (idle hint)","text":"Look closely at Biscuit's paws.","cls":"hint"}],"lo":["LO4"],"note":"Names a part that is still unfound."}]}]},{"t":"outcome","tone":"good","title":"All eight found","lines":[{"who":"Vet","text":"Great eyes! You found all 8. And now, one last thing for Biscuit: a vaccine.","cls":"vet"}],"note":"The vaccine cutscene, then “That evening”, then Bath Time.","lo":["LO4"],"kids":[{"t":"scene","title":"Vaccine cutscene","lines":[{"who":"Vet","text":"Biscuit was so brave! Vaccines protect against serious diseases, and only a vet can give them.","cls":"vet"},{"who":"Time card","text":"That evening","cls":"hint"}],"lo":["LO4"]}]}]},{"id":"bath","title":"Level 2, Task 2: Bath Time","nav":"L2 Bath Time","lo":["LO4"],"desc":"Each care item is dragged from the shelf onto the right part of the dog; the dog’s problems disappear one by one. The part under the item lights up.","roots":[{"t":"decision","title":"Start of the task","sub":"The first time, a ghost-hand demo shows the move; the ? button replays it.","lines":[{"who":"Parent","text":"Bath time! Drag each thing from the shelf onto the right part of Biscuit. Teeth, nails and ears come first.","cls":"parent"}],"lo":["LO4"],"kids":[{"t":"action","title":"Drag the dog toothbrush onto the teeth","kids":[{"t":"outcome","tone":"good","title":"Right place","meter":"+15","lo":["LO4"],"lines":[{"who":"Parent","text":"Dog toothpaste, little circles... bye-bye, tartar!","cls":"parent"}],"note":"The teeth problem disappears from the dog."}]},{"t":"action","title":"Drag the nail clippers onto the paws","kids":[{"t":"outcome","tone":"good","title":"Right place","meter":"+15","lo":["LO4"],"lines":[{"who":"Parent","text":"Just the tips, and never too short. Much better!","cls":"parent"}],"note":"The nails problem disappears from the dog."}]},{"t":"action","title":"Drag the ear cleaner onto the ears","kids":[{"t":"outcome","tone":"good","title":"Right place","meter":"+15","lo":["LO4"],"lines":[{"who":"Parent","text":"A little cleaner, then a gentle wipe. Clean ears!","cls":"parent"}],"note":"The ears problem disappears from the dog."}]},{"t":"action","title":"Drag the dog shampoo onto the coat","kids":[{"t":"outcome","tone":"good","title":"Right place","meter":"+15","lo":["LO4"],"lines":[{"who":"Parent","text":"Now scrub! Rub Biscuit back and forth to make lots of bubbles.","cls":"parent"}],"note":"Then rub back and forth until the foam is full (a demo shows how)."}]},{"t":"action","title":"Drag the towel onto the coat","kids":[{"t":"outcome","tone":"good","title":"Right place","meter":"+15","lo":["LO4"],"lines":[{"who":"Parent","text":"Rub Biscuit dry with the towel.","cls":"parent"}],"note":"Then rub the dog dry."}]},{"t":"action","title":"Drag the flea drops onto the neck","kids":[{"t":"outcome","tone":"good","title":"Right place","meter":"+15","lo":["LO4"],"lines":[{"who":"Parent","text":"Flea drops go on the back of the neck, where Biscuit can't lick them off.","cls":"parent"}],"note":"The fleas problem disappears from the dog."}]},{"t":"action","title":"Drop an item on the wrong part","kids":[{"t":"outcome","tone":"bad","title":"Wrong part","meter":"−5","lines":[{"who":"Parent","text":"Not there! The dog toothbrush is for Biscuit's teeth.","cls":"parent"}],"lo":["LO4"]}]},{"t":"action","title":"Use something too early","kids":[{"t":"outcome","tone":"neutral","title":"Not yet","lines":[{"who":"Parent","text":"Shampoo comes in the tub. Teeth, nails and ears first!","cls":"parent"},{"who":"Parent","text":"The towel comes after the bath.","cls":"parent"},{"who":"Parent","text":"Flea drops go on after the bath, once Biscuit is dry.","cls":"parent"},{"who":"Parent","text":"We already did that one!","cls":"parent"}],"note":"Teeth, nails and ears on the mat; shampoo in the tub; then the towel; flea drops last, once dry."}]}]},{"t":"outcome","tone":"good","title":"Task complete","lines":[{"who":"Parent","text":"Teeth, nails and ears are done! Into the tub, Biscuit!","cls":"parent"},{"who":"Parent","text":"So many bubbles! A quick rinse, and out you get.","cls":"parent"},{"who":"Parent","text":"Nice and dry! One last thing before Biscuit goes to play.","cls":"parent"},{"who":"Parent","text":"Dog shampoo, dog toothpaste, the right flea drops and a big chew toy. Now Biscuit has what they need!","cls":"parent"}],"note":"The Check-up Day album page.","lo":["LO4"]}]},{"id":"walk","title":"Level 3: the walk to the park","nav":"L3 Walk","lo":["LO3"],"desc":"Hold to walk, let go to stop. Three distractions (a squirrel, a dropped sandwich, a cat). Not a graded task: it introduces leash manners.","roots":[{"t":"scene","title":"Level 3 intro cutscene","lines":[{"who":"Time card","text":"One sunny morning","cls":"hint"},{"who":"Parent","text":"Biscuit is all grown up and full of energy. Let's walk to the park!","cls":"parent"}],"lo":["CTX"]},{"t":"decision","title":"Walking (hold anywhere)","sub":"The first time, a ghost-hand demo shows the move; the ? button replays it. Meter drain: 0.45 per second. No pointer cues and no timed hints in Level 3.","lines":[{"who":"Parent","text":"Hold down anywhere to walk. If Biscuit pulls, let go and stop. We only walk when the leash is loose.","cls":"parent"}],"lo":["LO3"],"kids":[{"t":"action","title":"Let go when the dog lunges","kids":[{"t":"outcome","tone":"good","title":"Good stop","meter":"+10","dog":"The dog sits and the leash goes loose.","lines":[{"who":"Parent","text":"Good stop! Biscuit sat down and the leash is loose. Hold to walk again.","cls":"parent"}],"lo":["LO3"]}]},{"t":"action","title":"Keep holding while it pulls","kids":[{"t":"outcome","tone":"bad","title":"Dragged ahead","meter":"−5","cards":[{"kind":"bad","title":"Stop when they pull","text":"If you keep walking when they pull, they learn that pulling works. Stop, and wait for a loose leash."}],"lines":[{"who":"Parent","text":"Let go when Biscuit pulls!","cls":"parent"}],"lo":["LO3"]}]}]},{"t":"outcome","tone":"good","title":"At the park gate","lines":[{"who":"Parent","text":"We made it to the park, and the leash stayed loose. Nice walking!","cls":"parent"},{"who":"Parent","text":"Here we are! Lots of room to run. Who wants to play fetch?","cls":"parent"}],"lo":["CTX"]}]},{"id":"fetch","title":"Level 3, Task 1: Fetch & Exercise","nav":"L3 Fetch","lo":["LO6"],"desc":"Drag the ball back and let go to throw. After 4 fetches the dog pants and slows down; nothing on screen points this out.","roots":[{"t":"decision","title":"Playing fetch","sub":"The first time, a ghost-hand demo shows the move; the ? button replays it.","lines":[{"who":"Parent","text":"Drag the ball back and let go to throw it. Keep an eye on Biscuit while you play!","cls":"parent"}],"lo":["LO6"],"kids":[{"t":"action","title":"Throw the ball","kids":[{"t":"outcome","tone":"good","title":"A fetch","meter":"+10","dog":"The dog runs, brings the ball back and drops it. From the fourth fetch it pants; the fifth is slow.","lo":["LO6"]}]},{"t":"action","title":"Keep throwing while it pants","kids":[{"t":"outcome","tone":"bad","title":"The dog flops down","meter":"−5","dog":"It lies down instead of fetching, with a hot thought bubble.","cards":[{"kind":"bad","title":"Time for a rest!","text":"Panting hard and lying down mean your dog needs rest, shade and water now."}],"lines":[{"who":"Parent","text":"Biscuit is too hot to play. Tap the shady tree, then drag the water bowl to Biscuit.","cls":"parent"}],"note":"A demo shows the rest response.","lo":["LO6"]}]},{"t":"action","title":"Tap the shady tree (once tired)","kids":[{"t":"outcome","tone":"good","title":"Rest in the shade","meter":"+15","lines":[{"who":"Parent","text":"Good call! Biscuit was panting hard. A rest in the shade helps.","cls":"parent"}],"lo":["LO6"]}]},{"t":"action","title":"Drag the water bowl to the dog (once tired)","kids":[{"t":"outcome","tone":"good","title":"A drink","meter":"+15","lines":[{"who":"Parent","text":"Fresh water helps Biscuit cool down.","cls":"parent"}],"lo":["LO6"]}]},{"t":"action","title":"Shade or water before it is tired","kids":[{"t":"outcome","tone":"neutral","title":"Not yet","lines":[{"who":"Parent","text":"Biscuit still has lots of energy! Throw the ball a few more times.","cls":"parent"}]}]}]},{"t":"outcome","tone":"good","title":"Rested and watered","cards":[{"kind":"info","title":"Hot days","text":"On hot days, walk in the morning or evening. Test the pavement with the back of your hand: if you can't hold it there for 7 seconds, it's too hot for paws."}],"lines":[{"who":"Parent","text":"Biscuit is cool and happy again. Great job looking after them!","cls":"parent"}],"note":"The “A little later” card, then Sam arrives.","lo":["LO6"]}]},{"id":"greet","title":"Level 3, Task 2: Meeting a new friend","nav":"L3 New friend","lo":["LO7"],"desc":"Sam asks to pet the dog. Three steps; in one of two random variants the dog shows stress signals (whale eye, lip licking, yawning, tucked tail) and the right answer changes.","roots":[{"t":"decision","title":"Step 1: Sam runs over","lines":[{"who":"Sam","text":"Can I pet your dog?!","cls":"parent"},{"who":"Parent","text":"Sam is running over! What do you say?","cls":"parent"}],"lo":["LO7"],"kids":[{"t":"action","title":"Sure, come here!","kids":[{"t":"outcome","tone":"bad","title":"Too fast","meter":"−5","dog":"The dog gets nervous.","cards":[{"kind":"bad","title":"Did you know?","text":"Running at a dog can scare it. Ask people to walk up slowly and calmly."}],"lines":[{"who":"Parent","text":"Let's ask Sam to try that again.","cls":"parent"}],"lo":["LO7"]}]},{"t":"action","title":"Stop! Walk slowly, please.","kids":[{"t":"outcome","tone":"good","title":"A calm approach","meter":"+15","cards":[{"kind":"good","title":"Did you know?","text":"Running at a dog can scare it, so a slow, calm walk is best."}],"lines":[{"who":"Sam","text":"Okay! I'll walk slowly.","cls":"parent"}],"lo":["LO7"]}]}]},{"t":"decision","title":"Step 2: read the dog (calm variant: a loose wag)","lines":[{"who":"Parent","text":"Sam is here. Look at Biscuit. What should happen next?","cls":"parent"}],"sub":"The question sits top-left so the dog stays in view.","lo":["LO7"],"kids":[{"t":"action","title":"Pet Biscuit right away","kids":[{"t":"outcome","tone":"bad","title":"Too soon","meter":"−5","cards":[{"kind":"bad","title":"Did you know?","text":"Petting right away can startle a dog. Let the dog sniff your hand first. A sniff is how dogs say hello."}],"lo":["LO7"]}]},{"t":"action","title":"Let Biscuit sniff your hand first","kids":[{"t":"outcome","tone":"good","title":"A sniff hello","meter":"+15","lines":[{"who":"Sam","text":"Hello, Biscuit! Here, sniff my hand.","cls":"parent"}],"cards":[{"kind":"good","title":"Did you know?","text":"A sniff is a dog's way of saying hello. Biscuit is wagging: that means \"Nice to meet you!\""}],"lo":["LO7"]}]},{"t":"action","title":"Not today, Biscuit needs space","kids":[{"t":"outcome","tone":"neutral","title":"No is always OK, but look again","lines":[{"who":"Parent","text":"It's always OK to say no, but look at Biscuit: a loose, wagging tail and a relaxed face. Biscuit is happy to say hello!","cls":"parent"}],"lo":["LO7"]}]}]},{"t":"decision","title":"Step 2: read the dog (stressed variant)","lines":[{"who":"Parent","text":"Sam is here. Look at Biscuit. What should happen next?","cls":"parent"}],"lo":["LO7"],"kids":[{"t":"action","title":"Pet Biscuit right away","kids":[{"t":"outcome","tone":"bad","title":"Not now","meter":"−5","cards":[{"kind":"bad","title":"Did you know?","text":"Look at Biscuit: licking lips, yawning, the whites of the eyes showing and a tucked tail. Those mean \"I'm uncomfortable\". Petting now could go wrong."}],"lo":["LO7"]}]},{"t":"action","title":"Let Biscuit sniff your hand first","kids":[{"t":"outcome","tone":"bad","title":"Not even a sniff","meter":"−5","cards":[{"kind":"bad","title":"Did you know?","text":"Look at Biscuit: licking lips, yawning, the whites of the eyes showing and a tucked tail. Those mean \"I'm uncomfortable\". Not even a sniff right now."}],"lo":["LO7"]}]},{"t":"action","title":"Not today, Biscuit needs space","kids":[{"t":"outcome","tone":"good","title":"Space","meter":"+15","cards":[{"kind":"good","title":"Biscuit needs space","text":"It's always OK to say no. Lip licking, yawning, whale eye and a tucked tail mean a dog is uncomfortable and needs space."}],"lines":[{"who":"Sam","text":"Okay! Maybe next time. Bye, Biscuit!","cls":"parent"}],"lo":["LO7"]}]}]},{"t":"decision","title":"Step 3 (calm variant): drag Sam’s hand onto the dog","sub":"The first time, a ghost-hand demo shows the move; the ? button replays it. The part under the hand lights up.","lines":[{"who":"Parent","text":"Now drag Sam's hand onto Biscuit. Where do dogs like to be petted?","cls":"parent"}],"lo":["LO7"],"kids":[{"t":"action","title":"Over the head","kids":[{"t":"outcome","tone":"bad","title":"The dog ducks","meter":"−5","cards":[{"kind":"bad","title":"Did you know?","text":"Many dogs don't like a hand coming over their head. The side of the neck or the chest is better."}],"lines":[{"who":"Parent","text":"Not over the head! Try somewhere else.","cls":"parent"}],"lo":["LO7"]}]},{"t":"action","title":"Side of the neck or chest","kids":[{"t":"outcome","tone":"good","title":"A happy dog","meter":"+15","cards":[{"kind":"good","title":"Did you know?","text":"Biscuit loves a scratch on the chest! Many dogs like that much more than a pat on the head."}],"lines":[{"who":"Sam","text":"Biscuit is so soft! Thank you!","cls":"parent"}],"lo":["LO7"]}]}]},{"t":"outcome","tone":"good","title":"Both sides of the lesson","cards":[{"kind":"info","title":"Both sides!","text":"When you meet a dog you don't know, ask the owner first, and let the dog sniff your hand."}],"note":"Then “That evening”, the Park Day album page and the finale.","lo":["LO7"]}]},{"id":"albums","title":"Album pages, growth and the finale","nav":"Albums and growth","lo":["LO1","LO2","LO4","LO6","LO7"],"desc":"After each level the player sees what they learned on a photo-album page, then the dog grows up. A “Pawfect!” stamp appears when the whole level had no wrong answer.","roots":[{"t":"scene","title":"After Level 1: “Day 1”","sub":"You learned: Safe foods and Potty spot.","lo":["LO1","LO2"],"kids":[{"t":"scene","title":"Growth: puppy to young dog","lines":[{"who":"Time card","text":"Two months later","cls":"hint"},{"who":"Parent","text":"Look how much Biscuit has grown! You're doing a great job.","cls":"parent"}],"lo":["CTX"]}]},{"t":"scene","title":"After Level 2: “Check-up Day”","sub":"You learned: Health check and Grooming.","lo":["LO4"],"kids":[{"t":"scene","title":"Growth: young dog to adult","lines":[{"who":"Time card","text":"A few months later","cls":"hint"},{"who":"Parent","text":"Look how big Biscuit is now! You're doing a great job.","cls":"parent"}],"lo":["CTX"]}]},{"t":"scene","title":"After Level 3: “Park Day”","sub":"You learned: Exercise safely and Safe greetings.","lo":["LO6","LO7"],"kids":[{"t":"scene","title":"Finale: “You’re a Pawfect Parent!”","lines":[{"who":"Time card","text":"That evening","cls":"hint"},{"who":"Parent","text":"What a day! Biscuit is all grown up, and so are you. You're a Pawfect Parent!","cls":"parent"}],"note":"An album spread with a photo from each level, then Level select or Back to title.","lo":["CTX"]}]}]},{"id":"rules","title":"Rules that apply everywhere: dialogue, demos, meter, hints, retry and pause","nav":"Meter, hints, retry","lo":["LO1","LO2","LO3","LO4","LO6","LO7"],"desc":"Dialogue boxes block the game until OK. Every new move gets a ghost-hand demo the first time (the ? button replays it). Things that can be tapped or dropped on light up under the pointer. Running out of meter never ends the game: the task restarts.","roots":[{"t":"system","title":"Happiness meter","sub":"Starts each task at 80 of 100. Drains 0.25, 0.35 and 0.45 per second in Levels 1, 2 and 3. Paused while any dialogue, card, choice, demo or the pause menu is open.","kids":[{"t":"action","title":"The meter reaches 0","kids":[{"t":"outcome","tone":"bad","title":"Retry screen","dog":"The scene greys out and the sad dog lies in a spotlight; Try again restarts that task only.","lines":[{"who":"Parent","text":"Biscuit got too hungry and sad. Remember: only dog-safe food. Let's try again!","cls":"parent"},{"who":"Parent","text":"Biscuit needed help with potty time. Watch for sniffing and circling. Let's try again!","cls":"parent"},{"who":"Parent","text":"Biscuit got bored waiting. Compare the two pictures part by part. Let's try again!","cls":"parent"},{"who":"Parent","text":"Biscuit got cold and fed up. Drag each thing onto the right part of Biscuit. Let's try again!","cls":"parent"},{"who":"Parent","text":"Biscuit pulled the whole way, and we ran out of time. Remember: stop when Biscuit pulls. Let's try again!","cls":"parent"},{"who":"Parent","text":"Biscuit got too hot and tired. Watch for panting, slowing down and lying down, then rest in the shade with water. Let's try again!","cls":"parent"},{"who":"Parent","text":"Biscuit got overwhelmed. Read Biscuit's body language and greet slowly. Let's try again!","cls":"parent"}],"lo":["LO1","LO2","LO4","LO6","LO7"]}]},{"t":"action","title":"The player waits without progress","kids":[{"t":"outcome","tone":"info","title":"Idle hints","lines":[{"who":"Level 1, after 15 s (idle hint)","text":"Dogs need dog food or plain, simple foods. Sweets and some fruits are dangerous.","cls":"hint"},{"who":"Level 1, after 15 s (idle hint)","text":"Dogs like a quiet potty spot, away from where they eat and sleep.","cls":"hint"},{"who":"Level 1, after 15 s (idle hint)","text":"Keep holding the treat, and move it slowly so Biscuit keeps following it.","cls":"hint"},{"who":"Level 2, after 25 s (idle hint)","text":"Look closely at Biscuit's ears.","cls":"hint"},{"who":"Level 2, after 25 s (idle hint)","text":"Drag something from the shelf onto Biscuit.","cls":"hint"}],"note":"Level 3 has no timed hints: help comes only after a wrong action."}]},{"t":"action","title":"The player taps the pause button","kids":[{"t":"decision","title":"Pause menu","kids":[{"t":"action","title":"Resume","kids":[{"t":"outcome","tone":"neutral","title":"Back to the task"}]},{"t":"action","title":"Sound on or off","kids":[{"t":"outcome","tone":"neutral","title":"The sound is toggled"}]},{"t":"action","title":"Level select","kids":[{"t":"outcome","tone":"neutral","title":"Back to the cork board"}]},{"t":"action","title":"Quit to title","kids":[{"t":"outcome","tone":"neutral","title":"Back to the title screen"}]}]}]}]}]}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const Q = new URLSearchParams(location.search), STATIC = Q.has('static');
document.body.classList.toggle('static', STATIC);
document.body.classList.toggle('print', Q.has('print'));
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const LOCLS = id => id === 'CTX' ? 'ctx' : id.toLowerCase();

$('intro').textContent = D.intro;
$('foot').textContent = D.foot;

// ----- legend + LO chips
const selected = new Set();
D.los.forEach(lo => {
  const c = el('button', 'chip'); c.type = 'button'; c.setAttribute('aria-pressed', 'false'); c.title = lo.text;
  const i = el('i', LOCLS(lo.id), lo.id); c.append(i, document.createTextNode(lo.short));
  c.addEventListener('click', () => { selected.has(lo.id) ? selected.delete(lo.id) : selected.add(lo.id); c.setAttribute('aria-pressed', selected.has(lo.id)); apply(); });
  $('chips').append(c);
});
[['#F3E9FA', '#B39DD6', 'Scene or cutscene'], ['#FFE08A', '#E0B53F', 'Decision point'], ['#FFFDF7', '#5A3E36', 'Player action'],
 ['#E4F4E8', '#6FA07E', 'Good outcome'], ['#FCE6E3', '#E8746A', 'Wrong outcome'], ['#E6F4FA', '#6FAFCB', 'Information / neutral'], ['#EEE6D8', '#8a6f66', 'Game rule (dashed)']]
  .forEach(([bg, bd, t]) => { const s = el('span'); const sw = el('i', 'sw'); sw.style.background = bg; sw.style.borderColor = bd; s.append(sw, document.createTextNode(t)); $('legend').append(s); });
const lg = el('span'); lg.append(document.createTextNode('Click a box with a + or – to open or close its branches.')); $('legend').append(lg);

// ----- tree
const KIND = { scene: 'Scene', decision: 'Decision', action: 'Player does', outcome: 'Result', system: 'Game rule' };
const all = [];
function annotate(n, parent) { n._parent = parent; n._los = new Set(n.lo || []); (n.kids || []).forEach(k => { annotate(k, n); k._los.forEach(l => n._los.add(l)); }); n._text = [n.title, n.sub, n.dog, n.note, ...(n.lines || []).map(l => l.text), ...(n.cards || []).map(c => c.title + ' ' + c.text)].join(' ').toLowerCase(); all.push(n); }

function boxFor(n) {
  const b = el('div', `box t-${n.t}${n.tone ? ' ' + n.tone : ''}`);
  const hd = el('div', 'hd'); hd.append(el('span', 'kind', n.kind || KIND[n.t]), el('span', 'ttl', n.title));
  if (n.meter) hd.append(el('span', 'meter ' + (n.meter.startsWith('+') ? 'up' : 'down'), n.meter + ' meter'));
  b.append(hd);
  if (n.sub) b.append(el('p', 'sub', n.sub));
  if (n.dog) b.append(el('p', 'dog', n.dog));
  (n.lines || []).forEach(l => { const d = el('div', 'say ' + (l.cls || l.who.toLowerCase())); d.append(el('b', null, l.who), document.createTextNode('“' + l.text + '”')); b.append(d); });
  (n.cards || []).forEach(c => { const d = el('div', 'card ' + c.kind); d.append(el('b', null, c.title), document.createTextNode(c.text)); b.append(d); });
  if (n.note) b.append(el('p', 'note', n.note));
  if (n.lo && n.lo.length) { const los = el('div', 'los'); n.lo.forEach(id => los.append(el('span', 'lo ' + LOCLS(id), id))); b.append(los); }
  n._box = b;
  return b;
}
function build(n, depth) {
  const node = el('div', 'node'); const b = boxFor(n); node.append(b); n._node = node;
  if (n.kids && n.kids.length) {
    b.classList.add('has-kids'); b.tabIndex = 0; b.setAttribute('role', 'button');
    const kids = el('div', 'kids'); n.kids.forEach(k => { const kid = el('div', 'kid'); kid.append(build(k, depth + 1)); kids.append(kid); });
    node.append(kids);
    const toggle = () => { node.classList.toggle('closed'); b.setAttribute('aria-expanded', !node.classList.contains('closed')); };
    b.setAttribute('aria-expanded', 'true');
    b.addEventListener('click', toggle);
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    if (!STATIC && depth >= 3) { node.classList.add('closed'); b.setAttribute('aria-expanded', 'false'); }
  }
  return node;
}

D.sections.forEach(s => {
  const page = el('section', 'page'); page.id = s.id;
  const hd = el('div', 'sec-hd'); hd.append(el('h2', null, s.title));
  const los = el('div', 'los'); (s.lo || []).forEach(id => los.append(el('span', 'lo ' + LOCLS(id), id))); hd.append(los);
  page.append(hd, el('p', 'desc', s.desc));
  const sc = el('div', 'scroll');
  if (s.flow) {
    const fl = el('div', 'flow');
    s.flow.forEach((st, i) => { const a = el('a', 'step'); a.href = '#' + st.go; a.append(el('span', 'num', String(i + 1)), el('b', null, st.title), el('small', null, st.sub)); const l = el('div', 'los'); (st.lo || []).forEach(id => l.append(el('span', 'lo ' + LOCLS(id), id))); a.append(l); fl.append(a); });
    sc.append(fl);
  } else { s.roots.forEach(r => { annotate(r, null); sc.append(build(r, 0)); }); }
  page.append(sc);
  if (s.id === 'overview') { $('p-top').append(page); $('p-top').append($('foot')); } else $('sections').append(page);
  if (s.id !== 'overview') { const a = el('a', null, s.nav || s.title); a.href = '#' + s.id; $('nav').append(a); }
});

// ----- controls
function setAll(open) { all.forEach(n => { if (n.kids && n.kids.length) { n._node.classList.toggle('closed', !open); n._box.setAttribute('aria-expanded', open); } }); }
$('expand').addEventListener('click', () => setAll(true));
$('collapse').addEventListener('click', () => { setAll(false); all.filter(n => !n._parent).forEach(n => { n._node.classList.remove('closed'); n._box.setAttribute('aria-expanded', 'true'); }); });
function apply() {
  const term = $('q').value.trim().toLowerCase(), filtering = selected.size > 0, searching = term.length > 1;
  let shown = 0, match = 0;
  all.forEach(n => {
    const own = !filtering || (n.lo || []).some(l => selected.has(l));
    const via = filtering && !own && [...n._los].some(l => selected.has(l));
    const hit = !searching || n._text.includes(term);
    const ok = own && hit;
    n._box.classList.toggle('dim', (filtering || searching) && !ok && !(via && !searching));
    n._box.classList.toggle('via', via && !searching);
    n._box.classList.toggle('found', searching && ok);
    if (ok) match++;
    if (searching && ok) { for (let p = n._parent; p; p = p._parent) p._node.classList.remove('closed'); }
  });
  $('status').textContent = (filtering || searching) ? `${match} of ${all.length} boxes match` : `${all.length} boxes in ${D.sections.filter(s => s.roots).length} trees`;
}
$('q').addEventListener('input', apply);
apply();

// ----- static mode: report the size the PNG and PDF need
if (STATIC) {
  const finish = () => {
    const pages = [...document.querySelectorAll('.page')];
    const w = Math.max(...pages.map(p => Math.max(p.scrollWidth, ...[...p.querySelectorAll('.scroll')].map(s => s.scrollWidth + 80))));
    const h = Math.max(...pages.map(p => Math.ceil(p.getBoundingClientRect().height)));
    document.title = 'M:' + JSON.stringify({ w: Math.ceil(w), h, total: Math.ceil(document.documentElement.scrollHeight) });
    if (Q.has('print')) {
      const st = document.createElement('style');
      st.textContent = `@page { size:${Math.ceil(w)}px ${h + 60}px; margin:0 } body.static.print .page { width:${Math.ceil(w)}px; }`;
      document.head.append(st);
    }
  };
  setTimeout(finish, 1500);      // (not document.fonts.ready: it can stall under headless virtual time)
}
</script>
</body>
</html>
