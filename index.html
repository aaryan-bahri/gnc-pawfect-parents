<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3E2A24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pawfect Parents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #3E2A24; overscroll-behavior: none; }
  body {
    height: 100dvh;                       /* the visible height on phones, where the address bar comes and goes */
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    touch-action: none;                   /* no scrolling, pull-to-refresh or double-tap zoom while playing */
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
