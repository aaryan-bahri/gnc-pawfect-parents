<!doctype html>
<meta charset="utf-8">
<title>Layout check</title>
<!-- Dev harness: measures every card/bubble text with real Phaser + Pixelify Sans and checks the layout.
     Serve from the repo root (python tools/serve.py) and open /tools/layout_check.html -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>body{margin:0;background:#222;color:#eee;font:14px monospace} #out{padding:8px;white-space:pre}</style>
<div id="game"></div>
<div id="out">running...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script type="module">
import { LEVEL1, LEVEL2, LEVEL3, CUTSCENES, fill } from '../src/content.js';
import { CARD, DIALOG, cardLayout, bodyWrapWidth } from '../src/layout.js';

const NAME = 'Marshmallo';   // longest allowed name (10 chars)
const FONT = { fontFamily: '"Pixelify Sans"', color: '#5A3E36' };
const BAR = { wrap: 498, maxH: 42 };                  // the cutscene text bar: 2 lines at 16px

// every string shown in a fact card, in the dialogue box, or in the cutscene bar
const CARD_KEYS = ['fact', 'tip', 'good', 'bad', 'pet', 'sniff', 'space', 'head', 'chest'];
const facts = [], speech = [], bar = [];
(function walk(o, inGreet) {
  for (const [k, v] of Object.entries(o)) {
    if (k === 'layout' || k === 'names' || k === 'choices' || k === 'album') continue;
    if (typeof v === 'string') (CARD_KEYS.includes(k) && (k !== 'space' && k !== 'pet' && k !== 'sniff' || inGreet) ? facts : speech).push(fill(v, NAME));
    else if (v && typeof v === 'object') walk(v, inGreet || k === 'greet');
  }
})({ LEVEL1, LEVEL2, LEVEL3 });
for (const beats of Object.values(CUTSCENES)) for (const b of beats) if (b.text) bar.push(fill(b.text, NAME));
const speechLines = speech.filter(s => s.length > 12 && s.includes(' '));   // skip ids / labels

await document.fonts.load('14px "Pixelify Sans"');
await document.fonts.load('600 18px "Pixelify Sans"');

class Check extends Phaser.Scene {
  preload() {
    this.load.image('card_bad', '../assets/ui/card_bad.png');
    this.load.spritesheet('button_mint', '../assets/ui/button_mint.png', { frameWidth: 16, frameHeight: 14 });
    this.load.image('icon_bulb', '../assets/ui/icon_bulb.png');
  }
  create() {
    const results = [];
    const measure = (s, size, w) => {
      const t = this.add.text(0, 0, s, { ...FONT, fontSize: size + 'px', wordWrap: { width: w } });
      const out = { h: t.height, w: t.width };
      t.destroy();
      return out;
    };
    let worst = null;
    for (const s of facts) {
      const m = measure(s, 14, bodyWrapWidth());
      const L = cardLayout(m.h);
      const ok = L.bodyY + m.h + CARD.gap <= L.buttonY && L.buttonY + CARD.buttonH + CARD.pad <= L.h
                 && m.w <= bodyWrapWidth() && L.fits;
      results.push({ kind: 'card', ok, h: L.h, bodyH: m.h, text: s.slice(0, 48) });
      if (!worst || L.h > worst.L.h) worst = { s, L, m };
    }
    for (const s of speechLines) {
      const m = measure(s, DIALOG.size, DIALOG.wrap);
      results.push({ kind: 'dialog', ok: m.h <= DIALOG.maxH && m.w <= DIALOG.wrap, h: m.h, text: s.slice(0, 48) });
    }
    for (const s of bar) {
      const m = measure(s, 16, BAR.wrap);
      results.push({ kind: 'bar', ok: m.h <= BAR.maxH && m.w <= BAR.wrap, h: m.h, text: s.slice(0, 48) });
    }

    // draw the tallest card exactly as the game will
    const { s, L } = worst, x = (640 - CARD.width) / 2, y = (360 - L.h) / 2;
    this.add.nineslice(x, y, 'card_bad', null, CARD.width / 2, L.h / 2, 6, 6, 6, 6).setOrigin(0).setScale(2);
    this.add.image(x + CARD.pad, y + L.titleY, 'icon_bulb').setOrigin(0).setScale(2);
    this.add.text(x + CARD.pad + 40, y + L.titleY + 6, 'Did you know?', { ...FONT, fontSize: '18px', fontStyle: '600', color: '#C95A52' });
    this.add.text(x + CARD.pad, y + L.bodyY, s, { ...FONT, fontSize: '14px', wordWrap: { width: bodyWrapWidth() } });
    this.add.nineslice(x + (CARD.width - CARD.buttonW) / 2, y + L.buttonY, 'button_mint', 0, CARD.buttonW / 2, CARD.buttonH / 2, 5, 5, 5, 5)
      .setOrigin(0).setScale(2);
    this.add.text(320, y + L.buttonY + 5, 'OK!', { ...FONT, fontSize: '15px' }).setOrigin(0.5, 0);

    const failed = results.filter(r => !r.ok);
    const summary = `${failed.length ? 'FAIL' : 'PASS'}: ${results.length} texts checked ` +
      `(${facts.length} cards, ${speechLines.length} dialogue lines, ${bar.length} cutscene lines). Tallest card ${worst.L.h}px of ${CARD.maxH}.`;
    document.getElementById('out').textContent = summary + '\n' +
      results.map(r => `${r.ok ? 'ok  ' : 'FAIL'} ${r.kind.padEnd(6)} h=${String(Math.round(r.h)).padStart(3)}  ${r.text}`).join('\n');
    console.log('[layout]', summary, JSON.stringify(failed));
  }
}

new Phaser.Game({ type: Phaser.AUTO, parent: 'game', width: 640, height: 360, pixelArt: true,
  backgroundColor: '#FFF4E0', scale: { mode: Phaser.Scale.NONE, zoom: 2 }, scene: Check });
</script>
